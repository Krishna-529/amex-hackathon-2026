name: CI

on:
  push:
    branches: [main]
    paths:
      - 'zkd-app/**'
      - 'zkd-risk-model/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'zkd-app/**'
      - 'zkd-risk-model/**'
      - '.github/workflows/ci.yml'

jobs:
  app:
    name: zkd-app — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zkd-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zkd-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # SESSION_SECRET is required at import time in production (see
      # server/auth/session.ts) — NODE_ENV isn't 'production' during a CI
      # build step by default, so this isn't load-bearing here, but setting
      # it keeps the build step honest about what a real deploy needs.
      - run: npm run build
        env:
          SESSION_SECRET: ci-build-only-not-a-real-secret

  risk-model:
    name: zkd-risk-model — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zkd-risk-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zkd-risk-model/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Real trained artifacts (models/) are small (~1.3MB) and checked into
      # git precisely so CI (and a fresh clone) has a working model without
      # re-downloading ~600MB of public BTS/ANAC data and retraining on
      # every push — retraining is a deliberate scheduled action
      # (infra/training.tf), not an implicit CI side effect.
      - name: Confirm real model artifacts are present
        run: test -f models/cancellation_model.json || (echo "models/ not checked in — see requirements-dev.txt job comment" && exit 1)
      - run: pytest -v

  playwright:
    name: zkd-app — Playwright happy path (real scorer + real app, both booted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zkd-risk-model/requirements.txt
      - name: Start the real scorer (same process the whole app talks to locally)
        working-directory: zkd-risk-model
        run: |
          pip install -r requirements.txt
          test -f models/cancellation_model.json || (echo "models/ not checked in" && exit 1)
          python src/serve.py 8090 &
          for i in $(seq 1 30); do curl -sf http://localhost:8090/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: zkd-app/package-lock.json
      - name: Start the real app against the real scorer
        working-directory: zkd-app
        env:
          RISK_MODEL_URL: http://localhost:8090
          SESSION_SECRET: ci-e2e-only-not-a-real-secret
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run dev &
          for i in $(seq 1 60); do curl -sf http://localhost:5176/login > /dev/null && break; sleep 1; done
      - name: Run the real Playwright happy path
        working-directory: zkd-app
        run: npx playwright test
